name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - name: Pruebas y quality gate (cobertura mínima 80 %)
        run: >
          pytest --cov=descuentos --cov-branch --cov-report=term-missing
          --cov-report=xml:reportes/coverage.xml --cov-fail-under=80
          --junitxml=reportes/junit.xml -ra --tb=short
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: reportes/
